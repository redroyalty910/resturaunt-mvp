<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

    <a href="/" class="absolute top-4 left-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Back to Mainpage
    </a>

    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" class="w-full border p-3 rounded mb-4">
            <input type="password" id="password" placeholder="Password" class="w-full border p-3 rounded mb-6">
            <button type="submit" class="w-full bg-red-700 text-white py-3 rounded-lg hover:bg-red-800">Login</button>
        </form>
        <p id="loginMessage" class="mt-4 text-center text-red-600 hidden"></p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const res = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            const msg = document.getElementById('loginMessage');

            if (data.success) {
                window.location.href = '/admin';
            } else {
                msg.textContent = data.message;
                msg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
